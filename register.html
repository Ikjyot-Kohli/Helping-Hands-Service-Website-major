<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register | Helping Hand</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="icon" href="favicon.png">
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-50 via-white to-emerald-50 flex items-center justify-center p-4">
<a href="index.html" class="fixed top-5 left-5"><img src="Share and Care Logo.jpeg" class="h-20 w-auto" alt="Share & Care"></a>
<main class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-7 border border-slate-100 my-10">
 <div class="text-center mb-6"><h1 class="text-3xl font-extrabold bg-gradient-to-r from-sky-600 to-emerald-600 bg-clip-text text-transparent">Create Your Account</h1><p class="text-sm text-slate-500 mt-2">One account for donating, borrowing and volunteering.</p></div>
 <div id="message" class="hidden mb-4 rounded-xl px-4 py-3 text-sm"></div>
 <form id="registerForm" class="grid md:grid-cols-2 gap-4" novalidate>
  <div><label class="block text-sm font-semibold mb-1" for="name">Full Name</label><input id="name" type="text" required minlength="2" pattern="[A-Za-z]+(?:[ '\-][A-Za-z]+)+" title="Use a normal first and last name, e.g. Rahul Verma." class="w-full rounded-xl border px-4 py-3" placeholder="Rahul Verma"></div>
  <div><label class="block text-sm font-semibold mb-1" for="email">Email</label><input id="email" type="email" required pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}" class="w-full rounded-xl border px-4 py-3" placeholder="rahul@example.com"></div>
  <div><label class="block text-sm font-semibold mb-1" for="phone">Phone Number</label><input id="phone" type="tel" required inputmode="numeric" maxlength="10" pattern="[0-9]{10}" class="w-full rounded-xl border px-4 py-3" placeholder="9876543210"></div>
  <div><label class="block text-sm font-semibold mb-1" for="location">Location / Area</label><input id="location" type="text" required minlength="2" class="w-full rounded-xl border px-4 py-3" placeholder="Vasai West"></div>
  <div><label class="block text-sm font-semibold mb-1" for="password">Password</label><div class="relative"><input id="password" type="password" required minlength="8" class="w-full rounded-xl border px-4 py-3 pr-12" placeholder="8+ characters"><button type="button" data-toggle="password" class="absolute right-3 top-3 text-sm">Show</button></div><p class="text-xs text-slate-500 mt-1">Use letters + number + special character.</p></div>
  <div><label class="block text-sm font-semibold mb-1" for="confirmPassword">Confirm Password</label><div class="relative"><input id="confirmPassword" type="password" required minlength="8" class="w-full rounded-xl border px-4 py-3 pr-12"><button type="button" data-toggle="confirmPassword" class="absolute right-3 top-3 text-sm">Show</button></div></div>
  <div><label class="block text-sm font-semibold mb-1" for="role">I want to use Helping Hand as</label><select id="role" class="w-full rounded-xl border px-4 py-3"><option value="user">Community Member</option><option value="donor">Donor</option><option value="volunteer">Volunteer</option></select></div>
  <div><label class="block text-sm font-semibold mb-1" for="availability">Availability</label><select id="availability" class="w-full rounded-xl border px-4 py-3"><option>Flexible</option><option>Weekends</option><option>Weekdays</option></select></div>
  <div class="md:col-span-2"><button class="w-full rounded-xl bg-gradient-to-r from-sky-600 to-emerald-600 text-white font-bold py-3.5">Create Account</button></div>
 </form>
 <p class="text-center text-sm text-slate-600 mt-6">Already registered? <a href="login.html" class="font-bold text-emerald-600">Sign in</a></p>
</main>
<script>
const $=id=>document.getElementById(id);
document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const p=$(b.dataset.toggle);p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Show':'Hide'});
$('phone').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,10));
$('email').addEventListener('input',e=>e.target.value=e.target.value.replace(/\s/g,'').toLowerCase());
$('name').addEventListener('input',e=>e.target.value=e.target.value.replace(/[^A-Za-z' -]/g,''));
function msg(text,error=true){$('message').textContent=text;$('message').className=(error?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-700')+' mb-4 rounded-xl px-4 py-3 text-sm'}
$('registerForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!e.target.checkValidity()){e.target.reportValidity();return}
 if($('password').value!==$('confirmPassword').value)return msg('Passwords do not match.');
 try{
  const body={name:$('name').value,email:$('email').value,phone:$('phone').value,location:$('location').value,password:$('password').value,confirmPassword:$('confirmPassword').value,role:$('role').value,availability:$('availability').value};
  const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();
  if(!r.ok)return msg(data.error||'Registration failed.');
  localStorage.setItem('hh_token',data.token);localStorage.setItem('hh_user',JSON.stringify(data.user));location.href='profile.html';
 }catch(err){msg('Cannot connect to the backend. Start the Node.js server and try again.')}
});
</script>
</body></html>
