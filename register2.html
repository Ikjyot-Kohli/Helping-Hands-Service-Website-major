<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Helping Hand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative">

    <!-- Top Left Logo Header -->
    <a href="index.html" class="absolute top-6 left-6 flex items-center gap-4 group z-10">
        <img src="logo.png" alt="Share & Care Logo" class="h-24 sm:h-28 w-auto object-contain transition-transform group-hover:scale-105">
    </a>

    <!-- Dark Registration Container -->
    <div class="w-full max-w-lg bg-slate-900/90 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-800 p-6 sm:p-8 mt-24 sm:mt-0">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-sky-400 via-teal-300 to-emerald-400 bg-clip-text text-transparent">
                Join Helping Hand
            </h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-1">Register to donate books, clothes, or become a volunteer</p>
        </div>

        <form id="registrationForm" class="space-y-4">
            
            <!-- Role Selection -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">I want to:</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" class="role-btn active py-2.5 px-2 text-xs sm:text-sm font-semibold rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-400 transition text-center" onclick="setRole('volunteer', this)">Volunteer</button>
                    <button type="button" class="role-btn py-2.5 px-2 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700 bg-slate-800 text-slate-400 hover:border-slate-600 transition text-center" onclick="setRole('books', this)">Donate Books</button>
                    <button type="button" class="role-btn py-2.5 px-2 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700 bg-slate-800 text-slate-400 hover:border-slate-600 transition text-center" onclick="setRole('clothes', this)">Donate Clothes</button>
                </div>
                <input type="hidden" id="selectedRole" name="role" value="volunteer">
            </div>

            <!-- Full Name -->
            <div>
                <label for="fullName" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Full Name</label>
                <input type="text" id="fullName" required placeholder="John Doe" 
                    class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
            </div>

            <!-- Email Address -->
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com" 
                    class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
            </div>

            <!-- Phone Number -->
            <div>
                <label for="phone" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Phone Number</label>
                <input type="tel" id="phone" required placeholder="9876543210" 
                    class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
            </div>

            <!-- Location -->
            <div>
                <label for="location" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Location / Area</label>
                <input type="text" id="location" required placeholder="e.g., Vasai West, Virar" 
                    class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
            </div>

            <!-- Dynamic Section: Books -->
            <div id="booksSection" class="hidden bg-slate-950/60 p-3.5 rounded-xl border border-slate-800">
                <label for="bookDetails" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Book Category / Titles</label>
                <textarea id="bookDetails" rows="2" placeholder="e.g., Class 10 Science textbooks, Story books..." 
                    class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"></textarea>
            </div>

            <!-- Dynamic Section: Clothes -->
            <div id="clothesSection" class="hidden bg-slate-950/60 p-3.5 rounded-xl border border-slate-800">
                <label for="clothesDetails" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Clothing Description & Age Group</label>
                <textarea id="clothesDetails" rows="2" placeholder="e.g., Winter wear for 8-10 year olds..." 
                    class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"></textarea>
            </div>

            <!-- Dynamic Section: Volunteer -->
            <div id="volunteerSection" class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800">
                <label for="availability" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Availability</label>
                <select id="availability" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    <option value="weekends">Weekends Only</option>
                    <option value="weekdays">Weekdays</option>
                    <option value="flexible">Flexible</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                class="w-full bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200 mt-2 text-sm">
                Complete Registration
            </button>
        </form>

        <!-- Login Link -->
        <div class="text-center text-xs text-slate-400 mt-5">
            Already registered? 
            <a href="login.html" class="font-bold text-sky-400 hover:underline">Sign in here</a>
        </div>
    </div>

    <script>
        function setRole(role, btnElement) {
            document.getElementById('selectedRole').value = role;
            
            // Reset button styles
            const buttons = document.querySelectorAll('.role-btn');
            buttons.forEach(btn => {
                btn.className = 'role-btn py-2.5 px-2 text-xs sm:text-sm font-semibold rounded-xl border border-slate-700 bg-slate-800 text-slate-400 hover:border-slate-600 transition text-center';
            });

            // Activate clicked button
            btnElement.className = 'role-btn active py-2.5 px-2 text-xs sm:text-sm font-semibold rounded-xl border border-emerald-500 bg-emerald-500/20 text-emerald-400 transition text-center';

            // Hide dynamic sections
            document.getElementById('booksSection').classList.add('hidden');
            document.getElementById('clothesSection').classList.add('hidden');
            document.getElementById('volunteerSection').classList.add('hidden');

            // Display targeted section
            if (role === 'books') {
                document.getElementById('booksSection').classList.remove('hidden');
            } else if (role === 'clothes') {
                document.getElementById('clothesSection').classList.remove('hidden');
            } else if (role === 'volunteer') {
                document.getElementById('volunteerSection').classList.remove('hidden');
            }
        }

        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for registering with Helping Hand!');
        });
    </script>
</body>
</html>
