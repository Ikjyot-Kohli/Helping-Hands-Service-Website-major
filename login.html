<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login | Helping Hand</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="favicon.png">
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-50 via-white to-emerald-50 flex items-center justify-center p-4">
<a href="index.html" class="fixed top-5 left-5"><img src="Share and Care Logo.jpeg" class="h-20 w-auto" alt="Share & Care"></a>
<main class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-7 border border-slate-100">
  <div class="text-center mb-7">
    <h1 class="text-3xl font-extrabold bg-gradient-to-r from-sky-600 to-emerald-600 bg-clip-text text-transparent">Welcome Back</h1>
    <p class="text-sm text-slate-500 mt-2">Sign in to manage your donations, borrowing and volunteer profile.</p>
  </div>
  <div id="message" class="hidden mb-4 rounded-xl px-4 py-3 text-sm"></div>
  <form id="loginForm" class="space-y-4" novalidate>
    <div><label class="block text-sm font-semibold mb-1" for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}" class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:ring-2 focus:ring-sky-400" placeholder="name@example.com"></div>
    <div><label class="block text-sm font-semibold mb-1" for="password">Password</label>
      <div class="relative"><input id="password" name="password" type="password" required minlength="8" autocomplete="current-password" class="w-full rounded-xl border border-slate-200 px-4 py-3 pr-12 outline-none focus:ring-2 focus:ring-sky-400" placeholder="Enter your password">
      <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-500">Show</button></div>
    </div>
    <button class="w-full rounded-xl bg-gradient-to-r from-sky-600 to-emerald-600 text-white font-bold py-3.5 hover:opacity-95">Sign In</button>
  </form>
  <p class="text-center text-sm text-slate-600 mt-6">Don't have an account?
    <a href="register.html" class="font-bold text-emerald-600 hover:underline">Register here</a></p>
</main>
<script>
const $=id=>document.getElementById(id);
$('togglePassword').onclick=()=>{const p=$('password');p.type=p.type==='password'?'text':'password';$('togglePassword').textContent=p.type==='password'?'Show':'Hide'};
$('email').addEventListener('input',e=>e.target.value=e.target.value.replace(/\s/g,'').toLowerCase());
function msg(text,error=true){$('message').textContent=text;$('message').className=(error?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-700')+' mb-4 rounded-xl px-4 py-3 text-sm'}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault(); if(!e.target.checkValidity()){e.target.reportValidity();return}
 try{
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});
  const data=await r.json(); if(!r.ok) return msg(data.error||'Login failed');
  localStorage.setItem('hh_token',data.token);localStorage.setItem('hh_user',JSON.stringify(data.user));
  const target=localStorage.getItem('hh_return_url')||'index.html';localStorage.removeItem('hh_return_url');location.href=target;
 }catch(err){msg('Cannot connect to the backend. Start the Node.js server and try again.')}
});
</script>
</body></html>
